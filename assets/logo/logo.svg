<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Emblem Icon -->
  <g transform="translate(10, 10)">
    <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" stroke="#00f3ff" stroke-width="3" fill="rgba(0, 243, 255, 0.08)" filter="url(#neonGlow)" />
    <polygon points="50,18 80,32 80,68 50,82 20,68 20,32" stroke="#bd00ff" stroke-width="2" fill="none" />
    <path d="M50 28 L50 72 M28 50 L72 50" stroke="#00f3ff" stroke-width="2" />
    <circle cx="50" cy="50" r="5" fill="#00ff9d" />
  </g>

  <!-- Typography -->
  <text x="125" y="72" font-family="'Orbitron', sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="4">
    CYBER<tspan fill="#00f3ff" filter="url(#neonGlow)">TRIX</tspan>
  </text>
  <text x="128" y="96" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="14" fill="#a0b2cc" letter-spacing="4">
    THINK. EXPLOIT. CAPTURE THE FLAG.
  </text>
</svg>
